# zim-claude · Claude Desktop integration — LiteLLM proxy config
#
#   Claude Desktop (Cowork / Chat / Code)
#        |  POST /v1/messages   Authorization: Bearer <master key>
#        v
#   LiteLLM :4002   (this config, started by start-desktop-proxy.sh)
#        |  OpenAI-style
#        v
#   Token Juice  ->  DeepSeek-V4.1-Flash
#
# Claude Desktop imposes two hard requirements on the gateway:
#
#   1. Every model_name MUST look like an Anthropic/Claude model
#      (contain "claude" or "anthropic"). Anything else is dropped
#      from the picker with:
#        inferenceModels: "X" is not an Anthropic model and was removed...
#      That is why DeepSeek is exposed under claude-* names below.
#
#   2. drop_params: true — Cowork/Code sessions send Anthropic-only
#      fields (cache_control, tool_reference, experimental beta
#      headers) that a non-Anthropic upstream rejects with HTTP 400.
#
#   3. Reasoning fields must never reach Token Juice. It answers 400
#      "Invalid request" to both `reasoning_effort` (chat/completions)
#      and `reasoning` (responses). `drop_params` alone does not save
#      you: litellm's /v1/messages handler has a SECOND path. When a
#      request carries thinking={"type":"enabled"} it rewrites the
#      model to `openai/responses/<model>` and converts thinking ->
#      `reasoning`, and that path ignores drop_params entirely. See
#      the litellm_params comment below for the two-part fix.
#
# The api_key is read from the environment; start-desktop-proxy.sh sources
# ~/claude-source/deepseek-claude so ANTHROPIC_AUTH_TOKEN holds your
# Token Juice key (same secret the zim-claude CLI proxy uses).

model_list:
  # Catch-all: EVERY model name resolves to the same upstream, so any agent or
  # subagent that asks for a specific tier — the bundled `claude-code-guide`
  # agent hardcodes `claude-haiku-5-5`, others ask for `claude-sonnet-5` — gets
  # the default model instead of
  #   `400: Invalid model name passed in model=claude-haiku-5-5`.
  # Claude Code names a model per request; without this the gateway only
  # answered for the one name the picker chose.
  #
  # It sits ABOVE the named entry on purpose: litellm matches the first
  # deployment whose model_name matches, so the specific entry below stays
  # reachable for `/v1/models` while everything else falls through to here.
  # The wildcard alone is not enough — with only `"*"`, `/v1/models` returns
  # an empty list and the app's picker comes up blank.
  - model_name: "*"
    litellm_params:
      model: hosted_vllm/deepseek-ai/DeepSeek-V4.1-Flash
      api_base: https://api.tokenjuice.ai/v1
      api_key: os.environ/ANTHROPIC_AUTH_TOKEN
      drop_params: true
      additional_drop_params: ["reasoning_effort", "thinking", "reasoning"]
    model_info:
      max_input_tokens: 253952
      max_output_tokens: 8192

  # DeepSeek-V4.1-Flash behind an Opus-shaped name so the Desktop picker
  # accepts it and shows it as an Opus-tier model.
  - model_name: claude-opus-5-5
    litellm_params:
      # NOT `openai/...`. Two reasons, both required:
      #
      #   a) litellm routes every `openai/*` deployment's /v1/messages
      #      call to the OpenAI *Responses* API (it is in the hardcoded
      #      _RESPONSES_API_PROVIDERS set), which Token Juice rejects.
      #      `hosted_vllm/*` is an OpenAI-compatible chat-completions
      #      provider, so it goes to /v1/chat/completions instead.
      #   b) the thinking rewrite described above only fires for
      #      custom_llm_provider == "openai".
      #
      # additional_drop_params then removes the reasoning fields before
      # they are serialized: litellm turns Anthropic `thinking` into
      # `reasoning_effort` for chat targets, and Token Juice 400s on it.
      # (drop_params does not cover these — it drops only params the
      # target model's price-map entry does not list, and this model has
      # no entry at all.)
      model: hosted_vllm/deepseek-ai/DeepSeek-V4.1-Flash
      api_base: https://api.tokenjuice.ai/v1
      api_key: os.environ/ANTHROPIC_AUTH_TOKEN
      drop_params: true
      additional_drop_params: ["reasoning_effort", "thinking", "reasoning"]
    # Token Juice enforces ONE 262144-token budget covering input AND output
    # together, not a separate input window. Advertise a real ceiling or the
    # app never compacts: without this, litellm reports the claude-* alias's
    # own 1000000 and a long Code session grows until the upstream refuses
    # with `context_length, limit 262144, actual 265777` — then keeps growing,
    # because each failed retry appends to the transcript.
    #
    # 253952 + the CLI's 8192 default max_tokens = 262144 exactly. The app
    # compacts at a percentage of this, so it turns over well before the limit.
    model_info:
      max_input_tokens: 253952
      max_output_tokens: 8192

  # --- Optional extra tiers -------------------------------------------------
  # Uncomment any of these to expose the SAME DeepSeek upstream under more
  # picker entries. Handy if a Cowork/Code background task asks for a
  # Sonnet- or Haiku-tier model by name.
  #
  # - model_name: claude-sonnet-4-5
  #   litellm_params:
  #     model: hosted_vllm/deepseek-ai/DeepSeek-V4.1-Flash
  #     api_base: https://api.tokenjuice.ai/v1
  #     api_key: os.environ/ANTHROPIC_AUTH_TOKEN
  #     drop_params: true
  #     additional_drop_params: ["reasoning_effort", "thinking", "reasoning"]
  #
  # - model_name: claude-haiku-4-5
  #   litellm_params:
  #     model: hosted_vllm/deepseek-ai/DeepSeek-V4.1-Flash
  #     api_base: https://api.tokenjuice.ai/v1
  #     api_key: os.environ/ANTHROPIC_AUTH_TOKEN
  #     drop_params: true
  #     additional_drop_params: ["reasoning_effort", "thinking", "reasoning"]

litellm_settings:
  # Belt-and-braces: strip unsupported params globally too.
  drop_params: true

general_settings:
  # Value Claude Desktop sends as "Gateway API key".
  # Set by start-desktop-proxy.sh (default: sk-claude-desktop-local).
  master_key: os.environ/CLAUDE_DESKTOP_LITELLM_KEY
